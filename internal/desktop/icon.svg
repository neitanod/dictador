<?xml version="1.0" encoding="UTF-8"?>
<!-- El ícono del dictador: un micrófono sobre el verde de la configuración.
     Va en SVG porque el escritorio lo pide en todos los tamaños a la vez —16
     en la bandeja, 48 en el escritorio, 256 en el diálogo de "abrir con"— y
     una sola escalable ahorra tener que dibujar cinco PNG. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#1c1c22"/>
  <rect x="3" y="3" width="58" height="58" rx="12" fill="none" stroke="#2f6b41" stroke-width="2"/>
  <g fill="none" stroke="#78c88c" stroke-width="4" stroke-linecap="round">
    <path d="M20 31a12 12 0 0 0 24 0"/>
    <path d="M32 43v7"/>
    <path d="M24 50h16"/>
  </g>
  <rect x="25" y="12" width="14" height="27" rx="7" fill="#78c88c"/>
</svg>
